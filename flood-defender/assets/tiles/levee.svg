<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <rect width="20" height="20" fill="#3e2723"/>
  <!-- sloped earth fill layers (stacked trapezoids) -->
  <polygon points="0,20 3,13 17,13 20,20" fill="#4e342e"/>
  <polygon points="3,13 5,8  15,8  17,13" fill="#5d4037"/>
  <polygon points="5,8  7,4  13,4  15,8"  fill="#6d4c41"/>
  <!-- concrete cap on top -->
  <rect x="5.5" y="3" width="9" height="2.5" fill="#9e9e9e" rx="0.5"/>
  <!-- water line indicator left side -->
  <path d="M0,10 Q1.5,9 3,10 Q4.5,11 6,10" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.7"/>
</svg>
